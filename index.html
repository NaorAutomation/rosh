<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>🍯 שנה טובה ומתוקה - משפחת בר ציון 🍎</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    
    <!-- Particles.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    
    <!-- Typed.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.16/typed.umd.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts Hebrew -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        html, body {
            font-family: 'Rubik', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            background: linear-gradient(135deg, #2D1B69 0%, #5D3A9B 40%, #8B5CF6 70%, #C4B5FD 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .main-container {
            position: fixed;
            z-index: 10;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        
        .honey-drip {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, 
                rgba(255, 215, 0, 0.4) 0%, 
                rgba(255, 165, 0, 0.2) 50%, 
                transparent 100%);
            animation: drip 5s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }
        
        @keyframes drip {
            0%, 100% { transform: translateY(-20px); opacity: 0.7; }
            50% { transform: translateY(0); opacity: 1; }
        }
        
        .greeting-card {
            text-align: center;
            backdrop-filter: blur(15px);
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.12) 0%, 
                rgba(255, 215, 0, 0.08) 100%);
            border-radius: 35px;
            padding: 20px;
            box-shadow: 
                0 25px 50px rgba(255, 215, 0, 0.3),
                inset 0 0 40px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.4);
            width: min(95vw, 600px);
            animation: floatCard 4s ease-in-out infinite;
        }
        
        @keyframes floatCard {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.02); }
        }
        
        .main-title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(90deg, 
                #FFD700, #FFA500, #FF6347, #FFD700);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShimmer 3s linear infinite;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        @keyframes goldShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }
        
        .photo-container {
            width: 200px;
            height: 200px;
            margin: 15px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            border: 4px solid #FFD700;
            position: relative;
            background: #FFD700;
            animation: photoPulse 2.5s infinite;
        }
        
        @keyframes photoPulse {
            0%, 100% { 
                box-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 100px rgba(255, 215, 0, 1);
                transform: scale(1.05);
            }
        }
        
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Special styling only for mom's image */
        .photo-container img[src*="mom.jpg"] {
            object-fit: contain !important;
            object-position: center center !important;
        }
        
        .photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2C003E;
            font-size: 3rem;
        }
        
        .blessing-display {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            color: #FFFFFF;
            margin: 20px auto;
            min-height: 60px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
            line-height: 1.6;
            font-weight: 600;
            padding: 10px;
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
            width: 100%;
            padding: 0 10px;
        }
        
        .btn-family {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #2C003E;
            border: none;
            padding: 12px 8px;
            border-radius: 25px;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 165, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            white-space: nowrap;
            min-height: 60px;
            opacity: 1 !important;
            visibility: visible !important;
            transform: scale(1) !important;
        }
        
        .btn-family i {
            font-size: 1.2rem;
        }
        
        .btn-family small {
            font-size: 0.7rem;
            opacity: 0.8;
            font-weight: 500;
            margin-top: 2px;
        }
        
        .btn-family:hover, .btn-family:active {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 12px 30px rgba(255, 165, 0, 0.5);
        }
        
        .btn-family.active {
            background: linear-gradient(135deg, #FF6347, #FF1493);
            animation: activeGlow 1s infinite;
        }
        
        @keyframes activeGlow {
            0%, 100% { box-shadow: 0 8px 20px rgba(255, 165, 0, 0.3); }
            50% { box-shadow: 0 8px 30px rgba(255, 20, 147, 0.6); }
        }
        
        .btn-special {
            grid-column: span 3;
            background: linear-gradient(45deg, 
                #FF1493, #FF69B4, #FFB6C1, #FF1493);
            background-size: 200% 200%;
            margin-top: 10px;
            padding: 15px;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            animation: specialAnim 2s ease infinite;
        }
        
        @keyframes specialAnim {
            0%, 100% { 
                background-position: 0% 50%;
                transform: scale(1);
            }
            50% { 
                background-position: 100% 50%;
                transform: scale(1.02);
            }
        }
        
        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 3px solid rgba(255, 255, 255, 0.3);
            color: #2C003E;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 165, 0, 0.4);
            transition: all 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .music-toggle:hover {
            transform: scale(1.1) rotate(10deg);
        }
        
        /* Decorative Elements */
        .decoration {
            position: fixed;
            opacity: 0.7;
            pointer-events: none;
            z-index: 3;
        }
        
        .pomegranate {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #FF69B4, #8B0000);
            border-radius: 50%;
            animation: bounce 4s infinite;
        }
        
        .apple {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 35% 35%, #FF6347, #8B0000);
            border-radius: 50% 50% 60% 60%;
            animation: sway 5s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
        
        @keyframes sway {
            0%, 100% { transform: translateX(0) rotate(-5deg); }
            50% { transform: translateX(20px) rotate(5deg); }
        }
        
        .year-display {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            color: rgba(255, 215, 0, 0.3);
            letter-spacing: 10px;
            animation: yearPulse 3s infinite;
            z-index: 2;
        }
        
        @keyframes yearPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        .emoji-rain {
            position: fixed;
            top: -50px;
            font-size: 30px;
            animation: fall 4s linear;
            z-index: 5;
            pointer-events: none;
        }
        
        @keyframes fall {
            to {
                transform: translateY(calc(100vh + 100px)) rotate(360deg);
            }
        }
        
        @media (max-width: 480px) {
            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .btn-special {
                grid-column: span 2;
            }
            
            .photo-container {
                width: 160px;
                height: 160px;
            }
            
            .greeting-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <!-- Decorations -->
    <div class="honey-drip"></div>
    <div class="year-display">תשפ"ה</div>
    
    <div class="decoration pomegranate" style="top: 10%; left: 5%;"></div>
    <div class="decoration apple" style="top: 15%; right: 10%;"></div>
    <div class="decoration pomegranate" style="bottom: 15%; left: 8%;"></div>
    <div class="decoration apple" style="bottom: 10%; right: 5%;"></div>
    
    <!-- Main Content -->
    <div class="main-container">
        <div class="greeting-card">
            <h1 class="main-title">
                <span>🍯</span> שנה טובה ומתוקה - משפחת בר ציון <span>🍎</span>
            </h1>
            
            <div class="photo-container" id="photoContainer">
                <div class="photo-placeholder">
                    <i class="fas fa-camera"></i>
                </div>
            </div>
            
            <div class="blessing-display">
                <span id="blessingText">שנה טובה ומתוקה! 🍯✨</span>
            </div>
            
            <div class="buttons-grid">
                <button class="btn-family" onclick="showPerson('roi')">
                    <i class="fas fa-star"></i>
                    <span>רואי</span>
                    <small>לחץ עליי</small>
                </button>
                
                <button class="btn-family" onclick="showPerson('mom')">
                    <i class="fas fa-heart"></i>
                    <span>אמא</span>
                    <small>לחץ עליי</small>
                </button>
                
                <button class="btn-family" onclick="showPerson('dad')">
                    <i class="fas fa-crown"></i>
                    <span>אבא</span>
                    <small>לחץ עליי</small>
                </button>
                
                <button class="btn-family" onclick="showPerson('savta')">
                    <i class="fas fa-dove"></i>
                    <span>סבתא אתי</span>
                    <small>לחץ עליי</small>
                </button>
                
                <button class="btn-family" onclick="showPerson('savtahani')">
                    <i class="fas fa-gem"></i>
                    <span>סבתא חני</span>
                    <small>לחץ עליי</small>
                </button>
                
                <button class="btn-family" onclick="showPerson('saba')">
                    <i class="fas fa-hat-wizard"></i>
                    <span>סבא</span>
                    <small>לחץ עליי</small>
                </button>
                
                <button class="btn-family btn-special" onclick="showSpecial()">
                    <i class="fas fa-gift"></i>
                    רוצים לראות אותי מתפנק? 🎉
                </button>
            </div>
        </div>
    </div>
    
    <!-- Music Button -->
    <button class="music-toggle" onclick="toggleMusic()">
        <i class="fas fa-music" id="musicIcon"></i>
    </button>
    
    <!-- Audio -->
    <audio id="bgMusic1" preload="auto" loop>
        <source src="./song1.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic2" preload="auto" loop>
        <source src="./spng2.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // Family Data
        const familyData = {
            roi: {
                text: "שנה טובה ומתוקה! 🍯✨ שתהיה שנה מלאה באושר ושמחה!",
                image: "./roi.jpg",
                emoji: "⭐"
            },
            mom: {
                text: "ראש השנה שמח אמא שלי, אני אוהב אותך וכ״כ מחובר אליך שאני לא יכול בלעדייך 💖",
                image: "./mom.jpg",
                emoji: "💖"
            },
            dad: {
                text: "אבא שלי שתמיד דואג לי ומשחק איתי אני אוהב אותך! 👑",
                image: "./dad.jpg",
                emoji: "👑"
            },
            savta: {
                text: "ראש השנה שמח סבתא אתי אני אוהב אותך עד הירח ובחזרה 🌙",
                image: "./savta.jpg",
                emoji: "🕊️"
            },
            savtahani: {
                text: "ראש השנה שמח סבתא חני אני אוהב אותך עד הירח ובחזרה 🌟",
                image: "./savtahani.jpg",
                emoji: "💎"
            },
            saba: {
                text: "ראש השנה שמח סבא! אני אוהב אותך עד הירח ובחזרה 🌙",
                image: "./saba.jpg",
                emoji: "🎩"
            }
        };
        
        let currentAudio = 1;
        let isPlaying = false;
        let typedInstance = null;
        let currentPerson = null;
        
        // Initialize particles
        function initParticles() {
            if (typeof particlesJS !== 'undefined') {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 80 },
                        color: { value: ['#FFD700', '#FFA500', '#FF6347'] },
                        shape: { type: 'circle' },
                        opacity: {
                            value: 0.6,
                            random: true,
                            animation: {
                                enable: true,
                                speed: 1.5
                            }
                        },
                        size: {
                            value: 4,
                            random: true,
                            animation: {
                                enable: true,
                                speed: 3
                            }
                        },
                        move: {
                            enable: true,
                            speed: 2,
                            direction: 'top',
                            random: true,
                            outMode: 'bounce'
                        }
                    },
                    interactivity: {
                        events: {
                            onHover: { enable: true, mode: 'bubble' },
                            onClick: { enable: true, mode: 'repulse' }
                        }
                    }
                });
            }
        }
        
        // Load image with fallback
        function loadImage(src, fallbackEmoji) {
            const container = document.getElementById('photoContainer');
            const img = new Image();
            
            console.log('Loading image:', src); // Debug log
            
            // Set timeout for image loading
            const timeout = setTimeout(() => {
                console.log('Image loading timeout:', src);
                container.innerHTML = `
                    <div class="photo-placeholder">
                        <span style="font-size: 4rem;">${fallbackEmoji}</span>
                    </div>
                `;
                animatePhotoChange();
            }, 5000); // 5 second timeout
            
            img.onload = function() {
                clearTimeout(timeout);
                console.log('Image loaded successfully:', src); // Debug log
                container.innerHTML = '';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.style.display = 'block';
                container.appendChild(img);
                animatePhotoChange();
            };
            
            img.onerror = function() {
                clearTimeout(timeout);
                console.log('Image failed to load:', src); // Debug log
                container.innerHTML = `
                    <div class="photo-placeholder">
                        <span style="font-size: 4rem;">${fallbackEmoji}</span>
                    </div>
                `;
                animatePhotoChange();
            };
            
            img.src = src;
        }
        
        // Animate photo change
        function animatePhotoChange() {
            const container = document.getElementById('photoContainer');
            gsap.from(container, {
                scale: 0,
                rotation: 360,
                duration: 0.6,
                ease: "back.out(1.7)"
            });
        }
        
        // Show person
        function showPerson(person) {
            const data = familyData[person];
            if (!data) return;
            
            currentPerson = person;
            
            // Update active button
            document.querySelectorAll('.btn-family').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.btn-family').classList.add('active');
            
            // Load image
            loadImage(data.image, data.emoji);
            
            // Update text with animation
            const textElement = document.getElementById('blessingText');
            gsap.to(textElement, {
                opacity: 0,
                y: -20,
                duration: 0.3,
                onComplete: () => {
                    textElement.textContent = data.text;
                    gsap.to(textElement, {
                        opacity: 1,
                        y: 0,
                        duration: 0.5,
                        ease: "power2.out"
                    });
                }
            });
            
            // Add emoji rain
            createEmojiRain();
        }
        
        // Show special
        function showSpecial() {
            loadImage('./dad1.jpg', '🎉');
            
            const textElement = document.getElementById('blessingText');
            textElement.textContent = 'וואוו! מתפנק על אבא! 😎🎉';
            
            // Special effects
            createConfetti();
            
            // Animate the whole card
            const card = document.querySelector('.greeting-card');
            gsap.timeline()
                .to(card, {
                    rotation: 5,
                    scale: 1.1,
                    duration: 0.3
                })
                .to(card, {
                    rotation: -5,
                    duration: 0.3
                })
                .to(card, {
                    rotation: 0,
                    scale: 1,
                    duration: 0.3,
                    ease: "elastic.out(1, 0.5)"
                });
        }
        
        // Create emoji rain
        function createEmojiRain() {
            const emojis = ['🍯', '🍎', '🌟', '✨', '🎉', '💖', '🥳'];
            
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.className = 'emoji-rain';
                    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    emoji.style.left = Math.random() * window.innerWidth + 'px';
                    emoji.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(emoji);
                    
                    setTimeout(() => emoji.remove(), 4000);
                }, i * 200);
            }
        }
        
        // Create confetti
        function createConfetti() {
            const colors = ['#FFD700', '#FFA500', '#FF6347', '#FF1493', '#00CED1'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = '50%';
                confetti.style.top = '50%';
                confetti.style.zIndex = '1000';
                confetti.style.pointerEvents = 'none';
                document.body.appendChild(confetti);
                
                const angle = (i / 50) * Math.PI * 2;
                const velocity = Math.random() * 400 + 200;
                
                gsap.to(confetti, {
                    x: Math.cos(angle) * velocity,
                    y: Math.sin(angle) * velocity,
                    rotation: Math.random() * 720,
                    opacity: 0,
                    duration: 2,
                    ease: "power2.out",
                    onComplete: () => confetti.remove()
                });
            }
        }
        
        // Toggle music
        function toggleMusic() {
            const audio1 = document.getElementById('bgMusic1');
            const audio2 = document.getElementById('bgMusic2');
            const icon = document.getElementById('musicIcon');
            
            if (!isPlaying) {
                audio1.volume = 0.3;
                audio2.volume = 0.3;
                
                audio1.play().then(() => {
                    isPlaying = true;
                    icon.className = 'fas fa-pause';
                }).catch(() => {});
                
                audio1.onended = () => {
                    audio2.play();
                    currentAudio = 2;
                };
                
                audio2.onended = () => {
                    audio1.play();
                    currentAudio = 1;
                };
            } else {
                audio1.pause();
                audio2.pause();
                isPlaying = false;
                icon.className = 'fas fa-music';
            }
        }
        
        // Preload all family images
        function preloadImages() {
            const images = ['./roi.jpg', './mom.jpg', './dad.jpg', './savta.jpg', './savtahani.jpg', './saba.jpg', './dad1.jpg'];
            images.forEach(src => {
                const img = new Image();
                img.src = src;
                console.log('Preloading image:', src);
            });
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initParticles();
            
            // Preload all images
            preloadImages();
            
            // Load Roi's image by default
            loadImage('./roi.jpg', '⭐');
            
            // Entrance animation
            gsap.from('.greeting-card', {
                scale: 0,
                rotation: -180,
                duration: 1,
                ease: "back.out(1.7)",
                delay: 0.5
            });
            
            gsap.from('.btn-family', {
                scale: 0,
                stagger: 0.1,
                duration: 0.5,
                ease: "back.out(1.7)",
                delay: 1,
                onComplete: function() {
                    // Ensure buttons remain visible after animation
                    gsap.set('.btn-family', { 
                        clearProps: "all",
                        opacity: 1,
                        visibility: "visible",
                        scale: 1
                    });
                }
            });
            
            // Auto-play music on first interaction
            document.addEventListener('click', () => {
                if (!isPlaying) {
                    document.getElementById('bgMusic1').play().catch(() => {});
                }
            }, { once: true });
            
            // Periodic effects
            setInterval(createEmojiRain, 20000);
        });
        
        // Prevent scrolling
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
